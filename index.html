<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ぷよてと 〜魔王サタンの逆襲〜</title>
<style>
  :root{
    --bg:#1a1230;
    --panel:#241a44;
    --accent:#8b5cf6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at 50% 0%, #2d1f5e 0%, var(--bg) 70%);
    color:#eee;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  h1{
    margin:10px 0 2px;
    font-size:clamp(18px,4vw,30px);
    background:linear-gradient(180deg,#ffe066,#ff7846);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 2px 8px rgba(255,120,70,.25);
    letter-spacing:.05em;
  }
  .sub{font-size:11px; color:#b9a7e8; margin-bottom:8px;}
  #arena{
    display:flex; gap:14px; align-items:flex-start; justify-content:center;
    flex-wrap:nowrap;
  }
  .side{
    background:var(--panel);
    border:2px solid #4c3a8c;
    border-radius:12px;
    padding:8px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  .side h2{font-size:13px; color:#d6c8ff; font-weight:600;}
  canvas{display:block; border-radius:6px; background:#0d0a1c;}
  .hud{display:flex; gap:10px; font-size:12px; color:#cbbcf5; width:100%; justify-content:space-between; min-height:18px;}
  .hud b{color:#ffe066; font-size:14px;}
  .garb{height:22px; display:flex; gap:3px; align-items:center; font-size:13px; min-width:100%;}
  .next-label{font-size:10px;color:#9b8ad0;}
  /* サタン */
  #satanBox{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    width:120px;
  }
  #satanFace{
    font-size:56px; line-height:1;
    filter:drop-shadow(0 0 12px rgba(139,92,246,.8));

  #satanFace.excited{transform:scale(1.25) rotate(-6deg);}
  #satanName{
    font-size:11px; font-weight:bold; color:#ffe066;
    background:#3a2a6e; border:1px solid #8b5cf6; border-radius:8px;
    padding:2px 8px; margin-top:4px;
  }
  #bubble{
    position:absolute; top:-8px; left:50%;
    transform:translate(-50%,-100%);
    background:#fffbe8; color:#3a2a10;
    font-weight:bold; font-size:14px;
    padding:7px 12px; border-radius:14px;
    border:2px solid #e8c84a;
    opacity:0; transition:opacity .2s;
    pointer-events:none;
    z-index:5;
    max-width:80vw; white-space:normal; text-align:center; min-width:90px;
  }
  #bubble.show{opacity:1;}
  #bubble::after{
    content:""; position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#e8c84a; border-bottom:0;
  }
  #chainShout{
    height:24px; font-size:18px; font-weight:bold; color:#ff7846;
    text-shadow:0 0 8px rgba(255,120,70,.6); text-align:center;
  }
  /* 中央カラム */
  #midCol{display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:30px; min-width:130px;}
  #vsMark{font-size:26px; font-weight:bold; color:#8b5cf6; text-shadow:0 0 10px #8b5cf6;}
  #wins{font-size:12px; color:#cbbcf5; text-align:center;}
  /* オーバーレイ */
  #overlay{
    position:fixed; inset:0; background:rgba(10,6,24,.88);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; z-index:20; text-align:center; padding:20px;
  }
  #overlay.hidden{display:none;}
  #ovTitle{font-size:clamp(22px,6vw,38px); font-weight:bold; color:#ffe066; text-shadow:0 0 16px rgba(255,224,102,.5);}
  #ovMsg{font-size:14px; color:#d6c8ff; line-height:1.9;}
  .btn{
    background:linear-gradient(180deg,#9d6bff,#6d3df0);
    border:none; border-radius:10px; color:#fff;
    font-size:16px; font-weight:bold; padding:12px 32px;
    cursor:pointer; font-family:inherit;
    box-shadow:0 4px 0 #4a28b0;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #4a28b0;}
  .modeCol{display:flex; flex-direction:column; gap:8px; width:min(420px, 90vw);}
  .mode{
    background:#2e2260; border:2px solid #5b46a8; color:#e6ddff;
    border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; font-family:inherit;
    text-align:left; line-height:1.5;
  }
  .mode small{color:#a995e0; font-size:11px; display:block;}
  .mode.sel{background:#6d3df0; border-color:#c4afff;}
  .mode.sel small{color:#ddd0ff;}
  .lvlRow{display:flex; gap:8px; align-items:center;}
  .lvlRow.hidden{visibility:hidden;}
  .lvl{
    background:#2e2260; border:2px solid #5b46a8; color:#cbbcf5;
    border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .lvl.sel{background:#6d3df0; color:#fff; border-color:#b9a0ff;}
  #muteBtn{
    position:fixed; top:8px; right:10px; z-index:30;
    background:#2e2260; border:1px solid #5b46a8; color:#fff;
    border-radius:8px; padding:5px 10px; font-size:14px; cursor:pointer;
  }
  /* タッチ操作 */
  #touchPad{
    display:none;
    gap:8px; margin:10px 0 16px;
  }
  .tbtn{
    width:54px; height:54px; border-radius:50%;
    background:#33246b; border:2px solid #5b46a8; color:#fff;
    font-size:20px; cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .tbtn:active{background:#6d3df0;}
  @media (pointer:coarse){ #touchPad{display:flex;} }
  #help{font-size:11px; color:#8d7cc4; margin:8px 0 14px; text-align:center; line-height:1.8;}
  @media (max-width:640px){
    #arena{gap:6px;}
    #midCol{min-width:0; padding-top:10px;}
    #satanBox{width:90px;}
    #satanFace{font-size:42px;}
  }
</style>

<body>
<h1>ぷよてと 〜魔王サタンの逆襲〜</h1>
<div class="sub">ぷよぷよ × テトリスが1つになった!</div>
<button id="muteBtn" title="掛け声の音声ON/OFF">🔊 声ON</button>

<div id="arena">
  <!-- プレイヤー -->

<div id="touchPad">

<div id="help">
  ←→:移動 ↓:高速落下 スペース:ハードドロップ Z / ⟲:左回転 X・↑ / ⟳:右回転 P:ポーズ M:声ON/OFF<br>
  ぷよは4つつなげると消える/テトリミノは横1列そろえると消える。連鎖で大ダメージ!
</div>

<div id="overlay">
  <div id="ovTitle">ぷよてと</div>
  <div id="ovMsg">フハハハハ!我こそは魔王サタン!<br>ぷよとテトリミノ、両方を従えてみせよ!</div>
  <div class="modeCol" id="modeCol">
    <button class="mode sel" data-mode="fusion">🌀 フュージョン(1人用)
      <small>1つの盤面にぷよとテトリミノが両方降ってくる合体モード。連鎖もラインも!</small></button>
    <button class="mode" data-mode="vs-puyo">😈 VS:ぷよで戦う
      <small>サタン(ぷよぷよ)vs CPU(テトリス)。連鎖でおじゃまを送り込め!</small></button>
    <button class="mode" data-mode="vs-tet">🟦 VS:テトリスで戦う
      <small>サタン(テトリス)vs CPU(ぷよぷよ)。テトリス消しで反撃だ!</small></button>
  </div>
  <div class="lvlRow" id="lvlRow">
    <button class="lvl" data-lvl="0">CPU:よわい</button>
    <button class="lvl sel" data-lvl="1">CPU:ふつう</button>
    <button class="lvl" data-lvl="2">CPU:つよい</button>
  </div>
  <button class="btn" id="startBtn">勝負スタート! (Enter)</button>
</div>

<script>
"use strict";
/* =========================================================
   ぷよてと — ぷよぷよ × テトリス
   モード:
     fusion  : 1盤面にぷよ+テトリミノ(1人用)
     vs-puyo : プレイヤー=ぷよ / CPU=テトリス
     vs-tet  : プレイヤー=テトリス / CPU=ぷよ
   ========================================================= */

// ---------- 共通 ----------
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const pick = arr => arr[rand(arr.length)];

// ---------- サタンのボイス ----------
let voiceOn = true;
let jaVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => v.lang.startsWith("ja")) || null;
}
if ("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function say(text){
  if (!voiceOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[!!?? …]/g,""));
  if (jaVoice) u.voice = jaVoice;
  u.lang = "ja-JP";
  u.pitch = 0.3;   // 低音の魔王ボイス
  u.rate = 1.05;
  speechSynthesis.speak(u);
}

let bubbleTimer = null;
function satanSay(text, speak = true, excite = false){
  const b = $("bubble");
  b.textContent = text;
  b.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove("show"), 2200);
  const f = $("satanFace");
  if (excite){
    f.classList.add("excited");
    setTimeout(() => f.classList.remove("excited"), 400);
  }
  if (speak) say(text);
}

const SATAN = {
  start: ["フハハハハ!我が魔王の力、見せてくれよう!", "さあ、宴の始まりじゃ!"],
  chain: ["ジュガム!", "バランガ!", "ディアキュート!", "アブラカタブラ!", "カタストロフィ!!", "これぞ魔王の真の力よーっ!!"],
  tetris: ["", "", "ジュガム!", "バランガ!", "アブラカタブラ!テトリスじゃ!!"],   // index = 消したライン数
  attack: ["くらうがよい!", "フハハハ!", "どうじゃ!"],
  damaged: ["ぬぅっ!?", "おのれ…小癪な!", "む、やりおるわ…"],
  pinch: ["ま、まずい…!", "魔王が…追い詰められておる…!?"],
  zenkeshi: ["全消しじゃ!フーハッハッハ!"],
  win: ["フハハハハ!見たか、これが魔王サタンの力よ!", "我に勝とうなど百年早いわ!フハハ!"],
  lose: ["ば…ばかな…この魔王サタンが…!", "ぐぬぬ…今日のところは引いてやるわ…!"],
};

$("muteBtn").onclick = () => {
  voiceOn = !voiceOn;
  $("muteBtn").textContent = voiceOn ? "🔊 声ON" : "🔇 声OFF";
  if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
};

// ---------- 全体状態 ----------
let mode = "fusion";
let running = false, paused = false, gameOver = false;
let cpuLevel = 1;
let winsP = 0, winsT = 0;
let lastTime = 0;
let elapsed = 0;

const keys = {left:false, right:false, down:false};

// ---------- 定数 ----------
const OJAMA = 9;
const PCOLORS = [null, "#ff4d4d", "#4dd24d", "#4da6ff", "#ffd24d"]; // ぷよ1-4色
const TSHAPES = {
  I: [[[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]]],
  O: [[[1,0],[2,0],[1,1],[2,1]]],
  T: [[[0,1],[1,1],[2,1],[1,0]], [[1,0],[1,1],[1,2],[2,1]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[1,1],[1,2],[0,1]]],
  S: [[[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]]],
  Z: [[[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]]],
  J: [[[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]]],
  L: [[[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]]],
};
const TCOLOR = {I:"#4dd2ff", O:"#ffd24d", T:"#c44dff", S:"#4dd24d", Z:"#ff4d6b", J:"#4d6bff", L:"#ff9a4d", G:"#777"};
const TNAMES = Object.keys(TSHAPES);
const CHAIN_POWER = [0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320];

// =========================================================
//  ぷよ盤面の汎用ヘルパー (fusionでも使う)
//  セル値: 0=空, 1-4=ぷよ, 9=おじゃま, 文字列=テトリミノブロック
// =========================================================
function gridCompact(grid, W, H){
  let moved = false;
  for (let x = 0; x < W; x++){
    let write = H - 1;
    for (let y = H - 1; y >= 0; y--){
      if (grid[y][x] !== 0){
        if (write !== y){
          grid[write][x] = grid[y][x];
          grid[y][x] = 0;
          moved = true;
        }
        write--;
      }
    }
  }
  return moved;
}

function gridFindGroups(grid, W, H, fromRow){
  const seen = Array.from({length: H}, () => Array(W).fill(false));
  const groups = [];
  for (let y = fromRow; y < H; y++){
    for (let x = 0; x < W; x++){
      const c = grid[y][x];
      if (typeof c !== "number" || c === 0 || c === OJAMA || seen[y][x]) continue;
      const cells = [], stack = [[x, y]];
      seen[y][x] = true;
      while (stack.length){
        const [cx, cy] = stack.pop();
        cells.push([cx, cy]);
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx = cx + dx, ny = cy + dy;
          if (nx < 0 || nx >= W || ny < fromRow || ny >= H) continue;
          if (!seen[ny][nx] && grid[ny][nx] === c){
            seen[ny][nx] = true;
            stack.push([nx, ny]);
          }
        }
      }
      if (cells.length >= 4) groups.push({color: c, cells});
    }
  }
  return groups;
}

// 消去対象と得点を計算 (おじゃま・ブロックの巻き込み含む)
function computePop(grid, W, H, fromRow, groups, chain){
  let cleared = 0;
  const colors = new Set();
  let groupBonus = 0;
  const popSet = new Set();
  for (const g of groups){
    cleared += g.cells.length;
    colors.add(g.color);
    groupBonus += Math.max(0, Math.min(g.cells.length - 4, 7));
    for (const [x, y] of g.cells) popSet.add(y * W + x);
  }
  for (const g of groups){
    for (const [x, y] of g.cells){
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= W || ny < fromRow || ny >= H) continue;
        const c = grid[ny][nx];
        if (c === OJAMA || typeof c === "string") popSet.add(ny * W + nx);
      }
    }
  }
  const colorBonus = [0, 0, 3, 6, 12][Math.min(colors.size, 4)];
  const chainBonus = CHAIN_POWER[Math.min(chain - 1, CHAIN_POWER.length - 1)];
  const mult = Math.max(1, Math.min(999, chainBonus + colorBonus + groupBonus));
  return { pts: cleared * 10 * mult, popSet };
}

// CPU思考用: 連鎖をその場で全部解決して結果を返す
function simulateChains(grid, W, H, fromRow){
  let chains = 0, pts = 0;
  for (;;){
    while (gridCompact(grid, W, H));
    const groups = gridFindGroups(grid, W, H, fromRow);
    if (!groups.length) break;
    chains++;
    const r = computePop(grid, W, H, fromRow, groups, chains);
    pts += r.pts;
    for (const key of r.popSet) grid[Math.floor(key / W)][key % W] = 0;
  }
  return { chains, pts, nui: pts / 70 };
}

// =========================================================
//  ぷよサイド (プレイヤー or CPU)
// =========================================================
function newPuyoSide(control){
  const P = {
    kind: "puyo", control,
    W: 6, H: 13, VIS: 12,        // 先頭1行は隠し
    grid: null, queue: [], pair: null,
    state: "spawn", timer: 0, gravT: 0, lockT: 0,
    chain: 0, maxChain: 0, score: 0, nuisance: 0, pending: 0,
    popping: [], fallSpeed: 700,
    das: {lt: 0, rt: 0},
    plan: null, thinkT: 0,
    thinkInt: [260, 150, 90][cpuLevel],
    blunder: [0.35, 0.12, 0.03][cpuLevel],
    sendAttack: null,            // (ojamaCount) => void
    alive: true,
  };
  P.grid = Array.from({length: P.H}, () => Array(P.W).fill(0));
  P.queue = [newPair(), newPair()];
  return P;
}
function newPair(){ return { a: 1 + rand(4), b: 1 + rand(4) }; }

const ROTD = [[0,-1],[1,0],[0,1],[-1,0]];
function pairCells(p){
  const d = ROTD[p.rot];
  return [{x: p.x, y: p.y, c: p.a}, {x: p.x + d[0], y: p.y + d[1], c: p.b}];
}
function pFree(P, x, y){
  if (x < 0 || x >= P.W || y >= P.H) return false;
  if (y < 0) return true;
  return P.grid[y][x] === 0;
}
function pairFits(P, p){ return pairCells(p).every(c => pFree(P, c.x, c.y)); }

function puyoSpawn(P){
  const q = P.queue.shift();
  P.queue.push(newPair());
  P.pair = { x: 2, y: 1, rot: 0, a: q.a, b: q.b };
  P.gravT = 0; P.lockT = 0;
  if (!pairFits(P, P.pair)){
    P.alive = false;
    return;
  }
  if (P.control === "cpu") P.plan = planPuyo(P);
  P.state = "fall";
  if (P.control === "human") drawNext();
}

function puyoMove(P, dx){
  const p = {...P.pair, x: P.pair.x + dx};
  if (pairFits(P, p)){ P.pair.x += dx; return true; }
  return false;
}
function puyoRotate(P, dir){
  const p = {...P.pair, rot: (P.pair.rot + dir + 4) % 4};
  if (pairFits(P, p)){ P.pair.rot = p.rot; return; }
  for (const k of [-1, 1]){
    const p2 = {...p, x: p.x + k};
    if (pairFits(P, p2)){ P.pair.rot = p2.rot; P.pair.x = p2.x; return; }
  }
  const p3 = {...P.pair, rot: (P.pair.rot + 2) % 4};   // クイックターン
  if (pairFits(P, p3)) P.pair.rot = p3.rot;
}
function puyoHardDrop(P){
  while (pairFits(P, {...P.pair, y: P.pair.y + 1})) P.pair.y++;
  puyoLock(P);
}
function puyoLock(P){
  for (const c of pairCells(P.pair)){
    if (c.y >= 0) P.grid[c.y][c.x] = c.c;
  }
  P.pair = null;
  P.chain = 0;
  P.nuisance = 0;
  P.state = "settle";
  P.timer = 60;
}

function puyoStartPop(P, groups){
  P.chain++;
  P.maxChain = Math.max(P.maxChain, P.chain);
  const r = computePop(P.grid, P.W, P.H, 1, groups, P.chain);
  P.score += r.pts;
  P.nuisance += r.pts / 70;
  P.popping = [...r.popSet];
  P.state = "pop";
  P.timer = 380;
  if (P.control === "human"){
    const line = SATAN.chain[Math.min(P.chain - 1, SATAN.chain.length - 1)];
    satanSay(line, true, P.chain >= 2);
    $("chainShout").textContent = P.chain >= 2 ? `${P.chain}連鎖!!` : "";
  } else if (P.chain >= 2){
    $("chainShout").textContent = `CPU ${P.chain}連鎖!`;
  }
}
function puyoFinishPop(P){
  for (const key of P.popping) P.grid[Math.floor(key / P.W)][key % P.W] = 0;
  P.popping = [];
  P.state = "settle";
  P.timer = 60;
}

function puyoChainEnded(P){
  if (P.control === "human") $("chainShout").textContent = "";
  else if ($("chainShout").textContent.startsWith("CPU")) $("chainShout").textContent = "";
  if (P.chain > 0 && P.grid.every(row => row.every(c => c === 0))){
    P.nuisance += 30;
    if (P.control === "human") satanSay(pick(SATAN.zenkeshi), true, true);
  }
  let atk = Math.round(P.nuisance);
  P.nuisance = 0;
  if (atk > 0){
    const offset = Math.min(atk, P.pending);
    P.pending -= offset;
    atk -= offset;
    if (atk > 0 && P.sendAttack){
      P.sendAttack(atk);
      if (P.control === "human" && P.chain >= 3) satanSay(pick(SATAN.attack), false, true);
    }
  }
  if (P.pending > 0) puyoDropOjama(P);
  else P.state = "spawn";
  updateHud();
}

function puyoDropOjama(P){
  const n = Math.min(P.pending, 30);
  P.pending -= n;
  const cols = [];
  for (let i = 0; i < n; i++) cols.push(i % P.W);
  for (let i = cols.length - 1; i > 0; i--){
    const j = rand(i + 1);
    [cols[i], cols[j]] = [cols[j], cols[i]];
  }
  for (const x of cols){
    for (let y = 0; y < P.H; y++){
      if (y === P.H - 1 || P.grid[y + 1][x] !== 0){
        if (P.grid[y][x] === 0) P.grid[y][x] = OJAMA;
        break;
      }
    }
  }
  if (n >= 6 && P.control === "human") satanSay(pick(SATAN.damaged), true);
  P.state = "drop-garbage";
  P.timer = 260;
}

// --- ぷよCPUの思考: 全配置をシミュレーションして評価 ---
function colHeight(grid, H, x){
  for (let y = 0; y < H; y++) if (grid[y][x] !== 0) return H - y;
  return 0;
}
function planPuyo(P){
  const {a, b} = P.pair;
  const danger = colHeight(P.grid, P.H, 2) >= P.H - 5 || P.pending >= 6;
  const opts = [];
  for (let rot = 0; rot < 4; rot++){
    const d = ROTD[rot];
    for (let x = 0; x < P.W; x++){
      const x2 = x + d[0];
      if (x2 < 0 || x2 >= P.W) continue;
      const g = P.grid.map(r => [...r]);
      const free = (xx, yy) => yy < P.H && (yy < 0 || g[yy][xx] === 0);
      let y = -2;
      while (free(x, y + 1) && free(x2, y + 1 + d[1])) y++;
      const cy = y + d[1];
      if (y < 1 || cy < 0) continue;          // 積み上がりすぎて置けない
      g[y][x] = a;
      g[cy][x2] = b;
      const sim = simulateChains(g, P.W, P.H, 1);
      // 隣接同色ペア数 (連鎖の種)
      let adj = 0;
      for (let yy = 1; yy < P.H; yy++){
        for (let xx = 0; xx < P.W; xx++){
          const c = g[yy][xx];
          if (typeof c !== "number" || c === 0 || c === OJAMA) continue;
          if (xx + 1 < P.W && g[yy][xx + 1] === c) adj++;
          if (yy + 1 < P.H && g[yy + 1][xx] === c) adj++;
        }
      }
      let maxH = 0;
      for (let xx = 0; xx < P.W; xx++) maxH = Math.max(maxH, colHeight(g, P.H, xx));
      let v = adj * 0.5 - maxH * 0.3 - colHeight(g, P.H, 2) * 0.45;
      if (sim.chains > 0){
        // 小さい連鎖の浪費はもったいない。ピンチ時 or 大連鎖なら撃つ
        const worth = danger ? 3 : (sim.nui >= 10 ? 1.6 : 0.15);
        v += sim.nui * worth;
      }
      v += (Math.random() - 0.5) * [1.6, 0.7, 0.2][cpuLevel];
      opts.push({rot, x, v});
    }
  }
  if (!opts.length) return null;
  opts.sort((q, w) => w.v - q.v);
  const idx = Math.random() < P.blunder ? Math.min(rand(3), opts.length - 1) : 0;
  return opts[idx];
}

function updatePuyoSide(P, dt){
  switch (P.state){
    case "spawn":
      puyoSpawn(P);
      break;
    case "fall": {
      const p = P.pair;
      if (!p) break;
      let soft = false;
      if (P.control === "human"){
        handleDasPuyo(P, dt);
        soft = keys.down;
      } else {
        // CPU操作
        P.thinkT += dt;
        if (P.plan && P.thinkT >= P.thinkInt){
          P.thinkT = 0;
          if (p.rot !== P.plan.rot) puyoRotate(P, 1);
          else if (p.x !== P.plan.x){
            if (!puyoMove(P, p.x < P.plan.x ? 1 : -1)) P.plan.x = p.x;
          }
        }
        soft = P.plan && p.rot === P.plan.rot && p.x === P.plan.x;
      }
      P.gravT += dt * (soft ? 14 : 1);
      while (P.gravT >= P.fallSpeed){
        P.gravT -= P.fallSpeed;
        if (pairFits(P, {...p, y: p.y + 1})){
          p.y++;
          P.lockT = 0;
          if (soft && P.control === "human") P.score += 1;
        } else {
          P.lockT = Math.max(P.lockT, 1);
        }
      }
      if (P.lockT > 0){
        P.lockT += dt;
        if (pairFits(P, {...p, y: p.y + 1})) P.lockT = 0;
        else if (P.lockT > (soft ? 80 : 420)) puyoLock(P);
      }
      break;
    }
    case "settle":
      P.timer -= dt;
      if (P.timer <= 0){
        if (gridCompact(P.grid, P.W, P.H)) P.timer = 50;
        else {
          const groups = gridFindGroups(P.grid, P.W, P.H, 1);
          if (groups.length) puyoStartPop(P, groups);
          else puyoChainEnded(P);
        }
      }
      break;
    case "pop":
      P.timer -= dt;
      if (P.timer <= 0) puyoFinishPop(P);
      break;
    case "drop-garbage":
      P.timer -= dt;
      if (P.timer <= 0){
        if (gridCompact(P.grid, P.W, P.H)) P.timer = 50;
        else P.state = "spawn";
      }
      break;
  }
}

// プレイヤー横移動の DAS (押しっぱなし連射)
const DAS = 160, ARR = 40;
function handleDasPuyo(P, dt){
  if (keys.left){ P.das.lt += dt; while (P.das.lt > DAS + ARR){ P.das.lt -= ARR; puyoMove(P, -1); } }
  else P.das.lt = 0;
  if (keys.right){ P.das.rt += dt; while (P.das.rt > DAS + ARR){ P.das.rt -= ARR; puyoMove(P, 1); } }
  else P.das.rt = 0;
}

// =========================================================
//  テトリスサイド (プレイヤー or CPU)
// =========================================================
function newTetSide(control){
  const T = {
    kind: "tet", control,
    W: 10, H: 22, VIS: 20,
    grid: null, bag: [], piece: null, queue: [],
    lines: 0, score: 0, pending: 0,
    gravT: 0, lockT: 0, moveT: 0, clearT: 0, clearing: [],
    plan: null,
    das: {lt: 0, rt: 0},
    gravity: control === "human" ? 700 : [800, 650, 500][cpuLevel],
    moveInterval: [200, 120, 70][cpuLevel],
    blunder: [0.30, 0.10, 0.02][cpuLevel],
    sendAttack: null,           // (lines) => void  ※おじゃまぷよ換算で送る
    alive: true,
  };
  T.grid = Array.from({length: T.H}, () => Array(T.W).fill(null));
  T.queue = [tetBag(T), tetBag(T)];
  return T;
}
function tetBag(T){
  if (T.bag.length === 0){
    T.bag = [...TNAMES];
    for (let i = T.bag.length - 1; i > 0; i--){
      const j = rand(i + 1);
      [T.bag[i], T.bag[j]] = [T.bag[j], T.bag[i]];
    }
  }
  return T.bag.pop();
}
function tetCells(name, rot, x, y){
  const shapes = TSHAPES[name];
  return shapes[rot % shapes.length].map(([cx, cy]) => [cx + x, cy + y]);
}
function tetFits(T, name, rot, x, y){
  return tetCells(name, rot, x, y).every(([cx, cy]) =>
    cx >= 0 && cx < T.W && cy < T.H && (cy < 0 || T.grid[cy][cx] === null));
}
function tetSpawn(T){
  const name = T.queue.shift();
  T.queue.push(tetBag(T));
  T.piece = { name, rot: 0, x: 3, y: 0 };
  T.gravT = 0; T.lockT = 0;
  if (!tetFits(T, name, 0, 3, 0)){
    T.alive = false;
    return;
  }
  if (T.control === "cpu") T.plan = planTet(T, name);
  else drawNext();
}
function tetRotate(T, dir){
  const p = T.piece;
  const len = TSHAPES[p.name].length;
  const nr = (p.rot + dir + len) % len;
  for (const kx of [0, -1, 1, -2, 2]){
    if (tetFits(T, p.name, nr, p.x + kx, p.y)){
      p.rot = nr; p.x += kx; T.lockT = 0;
      return;
    }
  }
}
function tetMove(T, dx){
  const p = T.piece;
  if (tetFits(T, p.name, p.rot, p.x + dx, p.y)){ p.x += dx; T.lockT = 0; return true; }
  return false;
}
function tetHardDrop(T){
  const p = T.piece;
  while (tetFits(T, p.name, p.rot, p.x, p.y + 1)){ p.y++; if (T.control === "human") T.score += 2; }
  tetLock(T);
}

function planTet(T, name){
  const shapes = TSHAPES[name];
  const options = [];
  for (let rot = 0; rot < shapes.length; rot++){
    for (let x = -2; x < T.W; x++){
      if (!tetFits(T, name, rot, x, 0)) continue;
      let y = 0;
      while (tetFits(T, name, rot, x, y + 1)) y++;
      const g = T.grid.map(r => [...r]);
      for (const [cx, cy] of tetCells(name, rot, x, y)){
        if (cy >= 0) g[cy][cx] = name;
      }
      let lines = 0;
      for (let ry = 0; ry < T.H; ry++){
        if (g[ry].every(c => c !== null)){ lines++; g.splice(ry, 1); g.unshift(Array(T.W).fill(null)); }
      }
      let agg = 0, holes = 0, bump = 0, prevH = -1;
      for (let cx = 0; cx < T.W; cx++){
        let h = 0, seenBlock = false;
        for (let cy = 0; cy < T.H; cy++){
          if (g[cy][cx] !== null){ if (!seenBlock){ h = T.H - cy; seenBlock = true; } }
          else if (seenBlock) holes++;
        }
        agg += h;
        if (prevH >= 0) bump += Math.abs(h - prevH);
        prevH = h;
      }
      const score = lines * 0.9 - agg * 0.51 - holes * 1.7 - bump * 0.18;
      options.push({rot, x, score});
    }
  }
  options.sort((a, b) => b.score - a.score);
  if (!options.length) return null;
  const idx = Math.random() < T.blunder ? Math.min(rand(3), options.length - 1) : 0;
  return options[idx];
}

function tetLock(T){
  for (const [cx, cy] of tetCells(T.piece.name, T.piece.rot, T.piece.x, T.piece.y)){
    if (cy >= 0) T.grid[cy][cx] = T.piece.name;
  }
  T.piece = null;
  T.clearing = [];
  for (let y = 0; y < T.H; y++){
    if (T.grid[y].every(c => c !== null)) T.clearing.push(y);
  }
  if (T.clearing.length) T.clearT = 240;
  else tetInsertGarbage(T);
}
function tetFinishClear(T){
  const n = T.clearing.length;
  for (const y of T.clearing){
    T.grid.splice(y, 1);
    T.grid.unshift(Array(T.W).fill(null));
  }
  T.clearing = [];
  T.lines += n;
  T.score += [0, 100, 300, 500, 800][n] || 800;
  if (T.control === "human"){
    const shout = SATAN.tetris[Math.min(n, 4)];
    if (shout) satanSay(shout, true, n >= 3);
    $("chainShout").textContent = n === 4 ? "テトリス!!" : "";
  }
  let atk = [0, 1, 5, 10, 20][n] || 20;   // おじゃまぷよ換算 (6個=自陣1段と相殺)
  if (atk > 0){
    const offset = Math.min(Math.floor(atk / 6), T.pending);
    T.pending -= offset;
    atk -= offset * 6;
    if (atk > 0 && T.sendAttack) T.sendAttack(atk);
  }
  tetInsertGarbage(T);
  updateHud();
}
function tetInsertGarbage(T){
  const n = Math.min(T.pending, 12);
  T.pending -= n;
  if (n > 0){
    for (let i = 0; i < n; i++){
      T.grid.shift();
      const row = Array(T.W).fill("G");
      row[rand(T.W)] = null;
      T.grid.push(row);
    }
    if (T.control === "human") satanSay(pick(SATAN.damaged), true);
  }
  updateHud();
}

function updateTetSide(T, dt){
  if (T.clearing.length){
    T.clearT -= dt;
    if (T.clearT <= 0) tetFinishClear(T);
    return;
  }
  if (!T.piece){
    tetSpawn(T);
    return;
  }
  const p = T.piece;
  let soft = false;
  if (T.control === "human"){
    if (keys.left){ T.das.lt += dt; while (T.das.lt > DAS + ARR){ T.das.lt -= ARR; tetMove(T, -1); } }
    else T.das.lt = 0;
    if (keys.right){ T.das.rt += dt; while (T.das.rt > DAS + ARR){ T.das.rt -= ARR; tetMove(T, 1); } }
    else T.das.rt = 0;
    soft = keys.down;
  } else {
    T.moveT += dt;
    if (T.plan && T.moveT >= T.moveInterval){
      T.moveT = 0;
      if (p.rot !== T.plan.rot){
        const nr = (p.rot + 1) % TSHAPES[p.name].length;
        if (tetFits(T, p.name, nr, p.x, p.y)) p.rot = nr;
      } else if (p.x !== T.plan.x){
        const dx = p.x < T.plan.x ? 1 : -1;
        if (!tetMove(T, dx)) T.plan.x = p.x;
      }
    }
    soft = T.plan && p.rot === T.plan.rot && p.x === T.plan.x;
  }
  T.gravT += dt * (soft ? (T.control === "human" ? 14 : 10) : 1);
  while (T.gravT >= T.gravity){
    T.gravT -= T.gravity;
    if (tetFits(T, p.name, p.rot, p.x, p.y + 1)){
      p.y++;
      T.lockT = 0;
      if (soft && T.control === "human") T.score += 1;
    } else {
      T.lockT = Math.max(T.lockT, 1);
    }
  }
  if (T.lockT > 0){
    T.lockT += dt;
    if (tetFits(T, p.name, p.rot, p.x, p.y + 1)) T.lockT = 0;
    else if (T.lockT > (soft ? 80 : 450)){ tetLock(T); }
  }
}

// =========================================================
//  フュージョン (1人用 / 1盤面にぷよ+テトリミノ)
// =========================================================
function newFusion(){
  const F = {
    kind: "fusion",
    W: 8, H: 16, VIS: 14,        // 先頭2行は隠し
    grid: null, queue: [],
    cur: null,                   // {type:'p', pair} or {type:'t', piece}
    state: "spawn", timer: 0, gravT: 0, lockT: 0,
    chain: 0, maxChain: 0, score: 0, lines: 0,
    popping: [], clearingRows: [],
    fallSpeed: 700,
    das: {lt: 0, rt: 0},
    alive: true,
  };
  F.grid = Array.from({length: F.H}, () => Array(F.W).fill(0));
  F.queue = [fusionItem(), fusionItem()];
  return F;
}
function fusionItem(){
  return Math.random() < 0.62
    ? { type: "p", a: 1 + rand(4), b: 1 + rand(4) }
    : { type: "t", name: TNAMES[rand(TNAMES.length)] };
}
function fFree(F, x, y){
  if (x < 0 || x >= F.W || y >= F.H) return false;
  if (y < 0) return true;
  return F.grid[y][x] === 0;
}
function fPairFits(F, p){ return pairCells(p).every(c => fFree(F, c.x, c.y)); }
function fTetFits(F, name, rot, x, y){
  return tetCells(name, rot, x, y).every(([cx, cy]) =>
    cx >= 0 && cx < F.W && cy < F.H && (cy < 0 || F.grid[cy][cx] === 0));
}

function fusionSpawn(F){
  const item = F.queue.shift();
  F.queue.push(fusionItem());
  F.gravT = 0; F.lockT = 0;
  if (item.type === "p"){
    F.cur = { type: "p", pair: { x: 3, y: F.H - F.VIS, rot: 0, a: item.a, b: item.b } };
    if (!fPairFits(F, F.cur.pair)){ F.alive = false; return; }
  } else {
    F.cur = { type: "t", piece: { name: item.name, rot: 0, x: 2, y: 0 } };
    const p = F.cur.piece;
    if (!fTetFits(F, p.name, p.rot, p.x, p.y)){ F.alive = false; return; }
  }
  F.state = "fall";
  drawNext();
}

function fusionMove(F, dx){
  if (F.cur.type === "p"){
    const p = F.cur.pair;
    if (fPairFits(F, {...p, x: p.x + dx})){ p.x += dx; F.lockT = 0; return true; }
  } else {
    const p = F.cur.piece;
    if (fTetFits(F, p.name, p.rot, p.x + dx, p.y)){ p.x += dx; F.lockT = 0; return true; }
  }
  return false;
}
function fusionRotate(F, dir){
  if (F.cur.type === "p"){
    const p = F.cur.pair;
    const r = {...p, rot: (p.rot + dir + 4) % 4};
    if (fPairFits(F, r)){ p.rot = r.rot; F.lockT = 0; return; }
    for (const k of [-1, 1]){
      const r2 = {...r, x: r.x + k};
      if (fPairFits(F, r2)){ p.rot = r2.rot; p.x = r2.x; F.lockT = 0; return; }
    }
    const r3 = {...p, rot: (p.rot + 2) % 4};
    if (fPairFits(F, r3)){ p.rot = r3.rot; F.lockT = 0; }
  } else {
    const p = F.cur.piece;
    const len = TSHAPES[p.name].length;
    const nr = (p.rot + dir + len) % len;
    for (const kx of [0, -1, 1, -2, 2]){
      if (fTetFits(F, p.name, nr, p.x + kx, p.y)){
        p.rot = nr; p.x += kx; F.lockT = 0;
        return;
      }
    }
  }
}
function fusionHardDrop(F){
  if (F.cur.type === "p"){
    const p = F.cur.pair;
    while (fPairFits(F, {...p, y: p.y + 1})) p.y++;
  } else {
    const p = F.cur.piece;
    while (fTetFits(F, p.name, p.rot, p.x, p.y + 1)){ p.y++; F.score += 2; }
  }
  fusionLock(F);
}
function fusionLock(F){
  if (F.cur.type === "p"){
    for (const c of pairCells(F.cur.pair)){
      if (c.y >= 0) F.grid[c.y][c.x] = c.c;
    }
  } else {
    const p = F.cur.piece;
    for (const [cx, cy] of tetCells(p.name, p.rot, p.x, p.y)){
      if (cy >= 0) F.grid[cy][cx] = p.name;
    }
  }
  F.cur = null;
  F.chain = 0;
  F.state = "settle";
  F.timer = 60;
}

function fusionCanFall(F){
  if (F.cur.type === "p") return fPairFits(F, {...F.cur.pair, y: F.cur.pair.y + 1});
  const p = F.cur.piece;
  return fTetFits(F, p.name, p.rot, p.x, p.y + 1);
}
function fusionFall(F){
  if (F.cur.type === "p") F.cur.pair.y++;
  else F.cur.piece.y++;
}

function updateFusion(F, dt){
  const fromRow = F.H - F.VIS;
  switch (F.state){
    case "spawn":
      fusionSpawn(F);
      break;
    case "fall": {
      if (!F.cur) break;
      if (keys.left){ F.das.lt += dt; while (F.das.lt > DAS + ARR){ F.das.lt -= ARR; fusionMove(F, -1); } }
      else F.das.lt = 0;
      if (keys.right){ F.das.rt += dt; while (F.das.rt > DAS + ARR){ F.das.rt -= ARR; fusionMove(F, 1); } }
      else F.das.rt = 0;
      const soft = keys.down;
      F.gravT += dt * (soft ? 14 : 1);
      while (F.gravT >= F.fallSpeed){
        F.gravT -= F.fallSpeed;
        if (fusionCanFall(F)){
          fusionFall(F);
          F.lockT = 0;
          if (soft) F.score += 1;
        } else {
          F.lockT = Math.max(F.lockT, 1);
        }
      }
      if (F.lockT > 0){
        F.lockT += dt;
        if (fusionCanFall(F)) F.lockT = 0;
        else if (F.lockT > (soft ? 80 : 430)) fusionLock(F);
      }
      break;
    }
    case "settle":
      F.timer -= dt;
      if (F.timer <= 0){
        if (gridCompact(F.grid, F.W, F.H)){ F.timer = 50; break; }
        // 1) 横1列そろったラインを消す
        const full = [];
        for (let y = fromRow; y < F.H; y++){
          if (F.grid[y].every(c => c !== 0)) full.push(y);
        }
        if (full.length){
          F.clearingRows = full;
          F.state = "lineclear";
          F.timer = 300;
          break;
        }
        // 2) ぷよの連結を消す
        const groups = gridFindGroups(F.grid, F.W, F.H, fromRow);
        if (groups.length){
          F.chain++;
          F.maxChain = Math.max(F.maxChain, F.chain);
          const r = computePop(F.grid, F.W, F.H, fromRow, groups, F.chain);
          F.score += r.pts;
          F.popping = [...r.popSet];
          F.state = "pop";
          F.timer = 380;
          const line = SATAN.chain[Math.min(F.chain - 1, SATAN.chain.length - 1)];
          satanSay(line, true, F.chain >= 2);
          $("chainShout").textContent = F.chain >= 2 ? `${F.chain}連鎖!!` : "";
        } else {
          // 全消し
          if (F.grid.every(row => row.every(c => c === 0)) && (F.chain > 0 || F.lines > 0)){
            if (F.chain > 0){ F.score += 2000; satanSay(pick(SATAN.zenkeshi), true, true); }
          }
          $("chainShout").textContent = "";
          F.state = "spawn";
          updateHud();
        }
      }
      break;
    case "lineclear":
      F.timer -= dt;
      if (F.timer <= 0){
        const n = F.clearingRows.length;
        for (const y of F.clearingRows){
          for (let x = 0; x < F.W; x++) F.grid[y][x] = 0;
        }
        F.clearingRows = [];
        F.lines += n;
        F.score += ([0, 100, 300, 500, 800][n] || 800) * (1 + Math.floor(F.lines / 10) * 0.2);
        const shout = SATAN.tetris[Math.min(n, 4)];
        if (shout) satanSay(shout, true, n >= 3);
        if (n >= 2) $("chainShout").textContent = n >= 4 ? "テトリス!!" : `${n}ライン!`;
        F.state = "settle";
        F.timer = 60;
        updateHud();
      }
      break;
    case "pop":
      F.timer -= dt;
      if (F.timer <= 0){
        for (const key of F.popping) F.grid[Math.floor(key / F.W)][key % F.W] = 0;
        F.popping = [];
        F.state = "settle";
        F.timer = 60;
        updateHud();
      }
      break;
  }
}

// =========================================================
//  エンティティと配線
// =========================================================
let sideL = null;   // プレイヤー側 (左)
let sideR = null;   // CPU側 (右)
let fus = null;

function playerEntity(){ return mode === "fusion" ? fus : sideL; }

function setupGame(){
  fus = null; sideL = null; sideR = null;
  if (mode === "fusion"){
    fus = newFusion();
  } else if (mode === "vs-puyo"){
    sideL = newPuyoSide("human");
    sideR = newTetSide("cpu");
    sideL.sendAttack = ojama => {                      // ぷよ → テト: 6個=1段
      sideR.pending += Math.floor(ojama / 6);
      updateHud();
    };
    sideR.sendAttack = ojama => {
      sideL.pending += ojama;
      if (ojama >= 6 && colHeight(sideL.grid, sideL.H, 2) >= 7) satanSay(pick(SATAN.pinch), true);
      updateHud();
    };
  } else { // vs-tet
    sideL = newTetSide("human");
    sideR = newPuyoSide("cpu");
    sideL.sendAttack = ojama => {
      sideR.pending += ojama;
      updateHud();
    };
    sideR.sendAttack = ojama => {
      sideL.pending += Math.floor(ojama / 6);
      if (sideL.pending >= 4) satanSay(pick(SATAN.pinch), true);
      updateHud();
    };
  }
  setupCanvas();
  updateHud();
  drawNext();
}

// =========================================================
//  入力
// =========================================================
function inputMove(dir){
  const e = playerEntity();
  if (!e || gameOver || paused) return;
  keys[dir] = true;
  const d = dir === "left" ? -1 : 1;
  if (e.kind === "puyo" && e.state === "fall" && e.pair) puyoMove(e, d);
  else if (e.kind === "tet" && e.piece && !e.clearing.length) tetMove(e, d);
  else if (e.kind === "fusion" && e.state === "fall" && e.cur) fusionMove(e, d);
  if (e.das){ e.das.lt = 0; e.das.rt = 0; }
}
function inputRotate(dir){
  const e = playerEntity();
  if (!e || gameOver || paused) return;
  if (e.kind === "puyo" && e.state === "fall" && e.pair) puyoRotate(e, dir);
  else if (e.kind === "tet" && e.piece && !e.clearing.length) tetRotate(e, dir);
  else if (e.kind === "fusion" && e.state === "fall" && e.cur) fusionRotate(e, dir);
}
function inputHardDrop(){
  const e = playerEntity();
  if (!e || gameOver || paused) return;
  if (e.kind === "puyo" && e.state === "fall" && e.pair) puyoHardDrop(e);
  else if (e.kind === "tet" && e.piece && !e.clearing.length) tetHardDrop(e);
  else if (e.kind === "fusion" && e.state === "fall" && e.cur) fusionHardDrop(e);
}

document.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowDown","ArrowUp"," "].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  if (!running || gameOver){
    if (e.key === "Enter") startGame();
    return;
  }
  switch (e.key){
    case "ArrowLeft": inputMove("left"); break;
    case "ArrowRight": inputMove("right"); break;
    case "ArrowDown": keys.down = true; break;
    case " ": inputHardDrop(); break;
    case "ArrowUp": case "x": case "X": inputRotate(1); break;
    case "z": case "Z": inputRotate(-1); break;
    case "p": case "P":
      paused = !paused;
      satanSay(paused ? "ひと休みじゃ" : "再開じゃ!", false);
      break;
    case "m": case "M": $("muteBtn").click(); break;
  }
});
document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
  if (e.key === "ArrowDown") keys.down = false;
});

function bindTouch(id, down, up){
  const el = $(id);
  el.addEventListener("pointerdown", e => { e.preventDefault(); down(); });
  el.addEventListener("pointerup", e => { e.preventDefault(); if (up) up(); });
  el.addEventListener("pointerleave", () => { if (up) up(); });
}
bindTouch("tbL", () => inputMove("left"), () => keys.left = false);
bindTouch("tbR", () => inputMove("right"), () => keys.right = false);
bindTouch("tbD", () => keys.down = true, () => keys.down = false);
bindTouch("tbHD", () => inputHardDrop());
bindTouch("tbRotL", () => inputRotate(-1));
bindTouch("tbRotR", () => inputRotate(1));

// =========================================================
//  描画
// =========================================================
const leftCv = $("leftCv"), rightCv = $("rightCv"), nextCv = $("nextCv");
const lctx = leftCv.getContext("2d"), rctx = rightCv.getContext("2d"), nctx = nextCv.getContext("2d");

function setupCanvas(){
  if (mode === "fusion"){
    leftCv.width = fus.W * 28; leftCv.height = fus.VIS * 28;
    $("rightPanel").style.display = "none";
    $("vsMark").style.display = "none";
    $("wins").style.display = "none";
    $("leftTitle").textContent = "😈 サタン (あなた)";
    $("garbL").style.display = "none";
  } else {
    $("rightPanel").style.display = "";
    $("vsMark").style.display = "";
    $("wins").style.display = "";
    $("garbL").style.display = "";
    if (mode === "vs-puyo"){
      leftCv.width = 6 * 32; leftCv.height = 12 * 32;
      rightCv.width = 10 * 18; rightCv.height = 20 * 18;
      $("leftTitle").textContent = "😈 サタン (ぷよ)";
      $("rightTitle").textContent = "🤖 CPU (テトリス)";
    } else {
      leftCv.width = 10 * 22; leftCv.height = 20 * 22;
      rightCv.width = 6 * 26; rightCv.height = 12 * 26;
      $("leftTitle").textContent = "😈 サタン (テトリス)";
      $("rightTitle").textContent = "🤖 CPU (ぷよ)";
    }
  }
}

function drawPuyoBall(ctx, x, y, c, size, popFlash){
  const r = size / 2 - 1.5;
  const cx = x + size / 2, cy = y + size / 2;
  if (c === OJAMA){
    ctx.fillStyle = popFlash ? "#fff" : "#9aa";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#445";
    ctx.beginPath(); ctx.arc(cx - r*0.32, cy - r*0.15, r*0.18, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.32, cy - r*0.15, r*0.18, 0, Math.PI*2); ctx.fill();
    return;
  }
  ctx.fillStyle = popFlash ? "#fff" : PCOLORS[c];
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  if (!popFlash){
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.arc(cx - r*0.35, cy - r*0.4, r*0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx - r*0.3, cy + r*0.05, r*0.26, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.3, cy + r*0.05, r*0.26, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#223";
    ctx.beginPath(); ctx.arc(cx - r*0.26, cy + r*0.08, r*0.12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.34, cy + r*0.08, r*0.12, 0, Math.PI*2); ctx.fill();
  }
}
function drawMino(ctx, px, py, size, color, flash){
  ctx.fillStyle = flash ? "#fff" : color;
  ctx.fillRect(px + 1, py + 1, size - 2, size - 2);
  if (!flash){
    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.fillRect(px + 1, py + 1, size - 2, 3);
  }
}
function drawGridLines(ctx, W, cell, w, h){
  ctx.strokeStyle = "rgba(255,255,255,.04)";
  for (let x = 1; x < W; x++){
    ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, h); ctx.stroke();
  }
}
function drawCross(ctx, x, y, cell){
  ctx.strokeStyle = "rgba(255,80,80,.5)";
  ctx.lineWidth = 2;
  const mx = x * cell + cell/2, my = y * cell + cell/2;
  ctx.beginPath();
  ctx.moveTo(mx-7, my-7); ctx.lineTo(mx+7, my+7);
  ctx.moveTo(mx+7, my-7); ctx.lineTo(mx-7, my+7);
  ctx.stroke();
  ctx.lineWidth = 1;
}

function drawPuyoBoard(ctx, P, cell){
  const cw = P.W * cell, ch = P.VIS * cell;
  ctx.clearRect(0, 0, cw, ch);
  drawGridLines(ctx, P.W, cell, cw, ch);
  drawCross(ctx, 2, 0, cell);
  const hidden = P.H - P.VIS;
  const flash = P.state === "pop" && Math.floor(P.timer / 80) % 2 === 0;
  const popSet = new Set(P.popping);
  for (let y = hidden; y < P.H; y++){
    for (let x = 0; x < P.W; x++){
      const c = P.grid[y][x];
      if (!c) continue;
      drawPuyoBall(ctx, x * cell, (y - hidden) * cell, c, cell, flash && popSet.has(y * P.W + x));
    }
  }
  if (P.pair && P.state === "fall"){
    let gy = P.pair.y;
    while (pairFits(P, {...P.pair, y: gy + 1})) gy++;
    ctx.globalAlpha = 0.25;
    for (const c of pairCells({...P.pair, y: gy})){
      if (c.y >= hidden) drawPuyoBall(ctx, c.x * cell, (c.y - hidden) * cell, c.c, cell, false);
    }
    ctx.globalAlpha = 1;
    for (const c of pairCells(P.pair)){
      if (c.y >= hidden) drawPuyoBall(ctx, c.x * cell, (c.y - hidden) * cell, c.c, cell, false);
    }
  }
}

function drawTetBoard(ctx, T, cell){
  const cw = T.W * cell, ch = T.VIS * cell;
  ctx.clearRect(0, 0, cw, ch);
  drawGridLines(ctx, T.W, cell, cw, ch);
  const hidden = T.H - T.VIS;
  const flash = T.clearing.length && Math.floor(T.clearT / 60) % 2 === 0;
  const clearSet = new Set(T.clearing);
  for (let y = hidden; y < T.H; y++){
    for (let x = 0; x < T.W; x++){
      const c = T.grid[y][x];
      if (!c) continue;
      drawMino(ctx, x * cell, (y - hidden) * cell, cell, TCOLOR[c], flash && clearSet.has(y));
    }
  }
  if (T.piece){
    const p = T.piece;
    // ゴースト
    let gy = p.y;
    while (tetFits(T, p.name, p.rot, p.x, gy + 1)) gy++;
    ctx.globalAlpha = 0.22;
    for (const [cx, cy] of tetCells(p.name, p.rot, p.x, gy)){
      if (cy >= hidden) drawMino(ctx, cx * cell, (cy - hidden) * cell, cell, TCOLOR[p.name], false);
    }
    ctx.globalAlpha = 1;
    for (const [cx, cy] of tetCells(p.name, p.rot, p.x, p.y)){
      if (cy >= hidden) drawMino(ctx, cx * cell, (cy - hidden) * cell, cell, TCOLOR[p.name], false);
    }
  }
}

function drawFusionBoard(ctx, F, cell){
  const cw = F.W * cell, ch = F.VIS * cell;
  ctx.clearRect(0, 0, cw, ch);
  drawGridLines(ctx, F.W, cell, cw, ch);
  drawCross(ctx, 3, 0, cell);
  const hidden = F.H - F.VIS;
  const popFlash = F.state === "pop" && Math.floor(F.timer / 80) % 2 === 0;
  const lineFlash = F.state === "lineclear" && Math.floor(F.timer / 60) % 2 === 0;
  const popSet = new Set(F.popping);
  const rowSet = new Set(F.clearingRows);
  for (let y = hidden; y < F.H; y++){
    for (let x = 0; x < F.W; x++){
      const c = F.grid[y][x];
      if (!c) continue;
      const flash = (popFlash && popSet.has(y * F.W + x)) || (lineFlash && rowSet.has(y));
      const px = x * cell, py = (y - hidden) * cell;
      if (typeof c === "string") drawMino(ctx, px, py, cell, TCOLOR[c], flash);
      else drawPuyoBall(ctx, px, py, c, cell, flash);
    }
  }
  if (F.cur && F.state === "fall"){
    if (F.cur.type === "p"){
      const p = F.cur.pair;
      let gy = p.y;
      while (fPairFits(F, {...p, y: gy + 1})) gy++;
      ctx.globalAlpha = 0.25;
      for (const c of pairCells({...p, y: gy})){
        if (c.y >= hidden) drawPuyoBall(ctx, c.x * cell, (c.y - hidden) * cell, c.c, cell, false);
      }
      ctx.globalAlpha = 1;
      for (const c of pairCells(p)){
        if (c.y >= hidden) drawPuyoBall(ctx, c.x * cell, (c.y - hidden) * cell, c.c, cell, false);
      }
    } else {
      const p = F.cur.piece;
      let gy = p.y;
      while (fTetFits(F, p.name, p.rot, p.x, gy + 1)) gy++;
      ctx.globalAlpha = 0.22;
      for (const [cx, cy] of tetCells(p.name, p.rot, p.x, gy)){
        if (cy >= hidden) drawMino(ctx, cx * cell, (cy - hidden) * cell, cell, TCOLOR[p.name], false);
      }
      ctx.globalAlpha = 1;
      for (const [cx, cy] of tetCells(p.name, p.rot, p.x, p.y)){
        if (cy >= hidden) drawMino(ctx, cx * cell, (cy - hidden) * cell, cell, TCOLOR[p.name], false);
      }
    }
  }
}

function drawNext(){
  nctx.clearRect(0, 0, nextCv.width, nextCv.height);
  const e = playerEntity();
  if (!e) return;
  if (e.kind === "puyo"){
    e.queue.forEach((q, i) => {
      const oy = i * 54 + 4;
      drawPuyoBall(nctx, 16, oy + 24, q.a, 24, false);
      drawPuyoBall(nctx, 16, oy, q.b, 24, false);
    });
  } else if (e.kind === "tet"){
    e.queue.forEach((name, i) => {
      const oy = i * 54 + 10;
      for (const [cx, cy] of TSHAPES[name][0]){
        drawMino(nctx, 4 + cx * 12, oy + cy * 12, 12, TCOLOR[name], false);
      }
    });
  } else {
    e.queue.forEach((item, i) => {
      const oy = i * 54 + 4;
      if (item.type === "p"){
        drawPuyoBall(nctx, 16, oy + 24, item.a, 24, false);
        drawPuyoBall(nctx, 16, oy, item.b, 24, false);
      } else {
        for (const [cx, cy] of TSHAPES[item.name][0]){
          drawMino(nctx, 4 + cx * 12, oy + 8 + cy * 12, 12, TCOLOR[item.name], false);
        }
      }
    });
  }
}

function ojamaIcons(n){
  let rest = n;
  const big = Math.floor(rest / 30); rest %= 30;
  const mid = Math.floor(rest / 6); rest %= 6;
  return "🪨".repeat(Math.min(big, 4)) + "🌑".repeat(Math.min(mid, 5)) + "⚫".repeat(rest);
}

function updateHud(){
  const hudL = $("hudL"), hudR = $("hudR");
  if (mode === "fusion"){
    hudL.innerHTML = `<span>スコア <b>${Math.floor(fus.score).toLocaleString()}</b></span>` +
      `<span>最大 <b>${fus.maxChain}</b>連鎖</span><span>ライン <b>${fus.lines}</b></span>`;
    return;
  }
  if (mode === "vs-puyo"){
    hudL.innerHTML = `<span>スコア <b>${sideL.score.toLocaleString()}</b></span>` +
      `<span>最大 <b>${sideL.maxChain}</b>連鎖</span>`;
    hudR.innerHTML = `<span>ライン <b>${sideR.lines}</b></span>`;
    $("garbL").innerHTML = sideL.pending > 0
      ? ojamaIcons(sideL.pending) + ` <span style="color:#ff9a9a">${sideL.pending}</span>` : "";
    $("garbR").innerHTML = sideR.pending > 0
      ? `<span style="color:#ff9a9a">▲ ${sideR.pending} 段</span>` : "";
  } else {
    hudL.innerHTML = `<span>スコア <b>${sideL.score.toLocaleString()}</b></span>` +
      `<span>ライン <b>${sideL.lines}</b></span>`;
    hudR.innerHTML = `<span>最大 <b>${sideR.maxChain}</b>連鎖</span>`;
    $("garbL").innerHTML = sideL.pending > 0
      ? `<span style="color:#ff9a9a">▲ ${sideL.pending} 段</span>` : "";
    $("garbR").innerHTML = sideR.pending > 0
      ? ojamaIcons(sideR.pending) + ` <span style="color:#ff9a9a">${sideR.pending}</span>` : "";
  }
}

// =========================================================
//  メインループ / 進行
// =========================================================
function updateEntity(e, dt){
  if (e.kind === "puyo") updatePuyoSide(e, dt);
  else if (e.kind === "tet") updateTetSide(e, dt);
  else updateFusion(e, dt);
}

function loop(t){
  const dt = Math.min(50, t - lastTime);
  lastTime = t;
  if (running && !paused && !gameOver){
    elapsed += dt;
    if (mode === "fusion"){
      fus.fallSpeed = Math.max(200, 700 - elapsed / 350 - fus.lines * 8);
      updateFusion(fus, dt);
      if (!fus.alive) endGame(null);
    } else {
      const speedup = Math.max(0, elapsed / 400);
      for (const e of [sideL, sideR]){
        if (e.kind === "puyo") e.fallSpeed = Math.max(220, 700 - speedup);
      }
      updateEntity(sideL, dt);
      updateEntity(sideR, dt);
      if (!sideL.alive) endGame(false);
      else if (!sideR.alive) endGame(true);
    }
  }
  // 描画
  if (mode === "fusion"){
    if (fus) drawFusionBoard(lctx, fus, 28);
  } else if (sideL){
    if (mode === "vs-puyo"){
      drawPuyoBoard(lctx, sideL, 32);
      drawTetBoard(rctx, sideR, 18);
    } else {
      drawTetBoard(lctx, sideL, 22);
      drawPuyoBoard(rctx, sideR, 26);
    }
  }
  if (paused){
    lctx.fillStyle = "rgba(0,0,0,.6)";
    lctx.fillRect(0, 0, leftCv.width, leftCv.height);
    lctx.fillStyle = "#fff";
    lctx.font = "bold 20px sans-serif";
    lctx.textAlign = "center";
    lctx.fillText("PAUSE", leftCv.width / 2, leftCv.height / 2);
    lctx.textAlign = "left";
  }
  requestAnimationFrame(loop);
}

function startGame(){
  gameOver = false;
  paused = false;
  running = true;
  elapsed = 0;
  setupGame();
  $("overlay").classList.add("hidden");
  $("chainShout").textContent = "";
  satanSay(pick(SATAN.start), true, true);
}

function endGame(playerWon){
  gameOver = true;
  let title, msg;
  if (mode === "fusion"){
    const line = pick(SATAN.lose);
    satanSay(line, true, true);
    title = "💥 ばたんきゅ〜…";
    msg = `${line}<br><br>スコア: <b>${Math.floor(fus.score).toLocaleString()}</b> / ` +
          `最大 ${fus.maxChain} 連鎖 / ${fus.lines} ライン`;
  } else {
    if (playerWon) winsP++; else winsT++;
    $("wP").textContent = winsP;
    $("wT").textContent = winsT;
    const line = playerWon ? pick(SATAN.win) : pick(SATAN.lose);
    satanSay(line, true, true);
    title = playerWon ? "🏆 サタンの勝利!" : "💥 ばたんきゅ〜…";
    msg = `${line}<br><br>戦績: サタン ${winsP} 勝 - CPU ${winsT} 勝`;
  }
  setTimeout(() => {
    $("ovTitle").textContent = title;
    $("ovMsg").innerHTML = msg;
    $("startBtn").textContent = "もう一度! (Enter)";
    $("overlay").classList.remove("hidden");
  }, 1600);
}

// ---------- オーバーレイUI ----------
document.querySelectorAll(".mode").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".mode").forEach(b => b.classList.remove("sel"));
    btn.classList.add("sel");
    mode = btn.dataset.mode;
    $("lvlRow").classList.toggle("hidden", mode === "fusion");
  };
});
document.querySelectorAll(".lvl").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".lvl").forEach(b => b.classList.remove("sel"));
    btn.classList.add("sel");
    cpuLevel = +btn.dataset.lvl;
  };
});
$("startBtn").onclick = startGame;
$("lvlRow").classList.add("hidden");   // 初期モードはフュージョン

requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(loop); });
</script>
